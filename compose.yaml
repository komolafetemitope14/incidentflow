
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: incidentflow_docker
      POSTGRES_USER: incidentflow_docker
      POSTGRES_PASSWORD: ${INCIDENTFLOW_DOCKER_DB_PASSWORD:?Set INCIDENTFLOW_DOCKER_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidentflow_docker -d incidentflow_docker
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://incidentflow_docker:${INCIDENTFLOW_DOCKER_DB_PASSWORD:?Set INCIDENTFLOW_DOCKER_DB_PASSWORD}@db:5432/incidentflow_docker
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - python -m alembic upgrade head && exec uvicorn api:app --host 0.0.0.0 --port 8000


  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      - api


  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${INCIDENTFLOW_GRAFANA_ADMIN_PASSWORD:?Set INCIDENTFLOW_GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  grafana_data:
  prometheus_data:
  postgres_data:
