name: IncidentFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: incidentflow_ci
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: incidentflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentflow_ci -d incidentflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://incidentflow_ci:ci_test_password@127.0.0.1:5432/incidentflow_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run automated tests
        run: python -m pytest -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t incidentflow:ci .
